title: '[FlyDSL] AITER: single-kernel GDN fused chunked prefill for gfx950'
status: local
description: 'AITER patch on the pin 285579b62 (port of fork 9539fd39 as-is, author Nikolai Protasov).

  One launch replaces the l2norm, prepare, chunk hidden-state and output stages (BT=64, K=V=128); the state stays on chip,

  the bf16 pool is updated in place, optional fp32 chunk-boundary snapshot for prefix caching.

  API: gdn_fused_prefill_fwd + gdn_fused_prefill_supported (callers keep their multi-kernel path when it returns False).

  '
impact:
  summary: 'kernel only: 1.9-2.4x vs SGLang Triton chunk_gated_delta_rule at Qwen3.8 TP1 shapes (16k tokens 1694 -> 878 us); no standalone e2e
    gate, end-to-end effect is inside 07-gdn-aiter-prefill'
  measured: 2026-11-03, gfx950, AITER pin 285579b62
  stack: 'full stack (all kept PRs, AITER 03+04) vs bare v2, 2026-11-04: t1 c24 +20.5% tput / +28.2% p90; t1 c80 +16.4% / +20.9%; 16k c24 +20.0%
    / +22.0%; 16k c80 +16.3% / +17.0% (see README)'
numerics: 'Not bit-exact. op_test passes vs fp32 token-by-token recurrence (rel L2 o 3.3e-3, state 2.9e-3, track 2.3e-3). GSM8K: see PR 07.'
env: none (reached only through SGLang PR 07)
