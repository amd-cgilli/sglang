title: '[Perf] [AMD] cuda graph: default prefill to breakable CUDA graphs on ROCm'
status: local
description: default_prefill_backend() returned BREAKABLE only on CUDA, so ROCm prefill ran eager. It now returns
  BREAKABLE on HIP too (same as passing --cuda-graph-backend-prefill breakable, the NV B300 recipe flag). Captures
  74 token buckets 4..16384 (max = chunked-prefill). HiCache on HIP uses the wait_for_layer_loads barrier (no event
  capture). Affects every ROCm model.
impact:
  summary: 'gate vs mean of 2 base runs (CONFIRM=1), tput / P90: shaped c24 +7.4% / +5.9%, shaped c80 +8.7% / +6.4%,
    short c24 +5.8% / +5.1%, short c80 +7.9% / +8.1% (explicit-flag gate bpg-breakable-prefill: +6.5..+8.4% tput).
    TTFT 64k cached prefix + 256/1024/4096 new: 115/119/151 -> 53/73/147 ms. Cost: capture +46 s, graph pool +19.9
    GB (target 18.3 + draft 1.6) from post-KV headroom, KV pool unchanged. Agentic (incl. OOM headroom) not measured'
  measured: 2026-11-05 19:24-20:55Z, node b23-07, MI355X TP1 rocm-smi 2 (c24) / 3 (c80); A = stack sglang 2da35881db
    + AITER 32ac35904, B = A + this PR (190a722948); results/gates/bcg-prefill-rocm.json
numerics: 'Not bit-exact checked (greedy outputs differ between two eager runs too: MTP + HiCache nondeterminism).
  GSM8K 1319, real MTP: 96.3%, accept len 3.03 (explicit-flag arm, same code path).'
env: none (default on HIP); opt out with --cuda-graph-backend-prefill disabled
changes:
  sglang:
    files: 1
    insertions: 3
    deletions: 3
    per_file:
      python/sglang/srt/model_executor/cuda_graph_config.py: +3 -3
base:
  sglang: 99fd01047d
