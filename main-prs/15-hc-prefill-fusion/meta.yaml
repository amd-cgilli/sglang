title: '[Perf] [AMD] Qwen4-Exp HC: fused prefill hc_combine kernel'
status: local
author: Nikolai Protasov <nprotaso@amd.com>
ported_from: 5e9bf8f2d6 (amd-nprotaso/sglang qwen_3_8_improvement, "prefill HC optimization")
description: 'Fuses the HC combine with the next sublayer''s per-branch grouped Gemma RMSNorm into one JIT kernel
  (hc_combine_norm): the

  combined row stays in registers, so the norm does not re-read it from HBM. GatedResidual.combine_and_normalize
  uses it when

  no decode partials are present (prefill, and sites outside 08''s decode path), and mix() takes the returned norm
  as its

  normalized_input. Falls back to combine when next_norm.weight.numel() != hc_count * hidden_size. Gated by

  SGLANG_ENABLE_HC_COMBINE_NORM_FUSION (default on for HIP, off elsewhere). Per site (hc4 x 2560) fused vs unfused:

  M=16384 315.5 vs 408.0 us, M=8192 165.0 vs 210.6 us, M=1024 18.6 vs 28.4 us. Ported by Christian Gilli onto upstream''s

  combine_and_normalize / normalized_input HC API.

  '
impact:
  summary: t1 c80 +2.4% tput / +4.7% p90 (vs mean of 2 base runs, base spread 2.3%); 16k c80 +3.7% / +3.7%; t1 c24
    +0.4% / +0.2% (3 sequences pooled); 16k c24 +0.0% / +1.9% (2 sequences pooled). Kept by a small margin (gain
    ~2x noise); integrated on user request to track the HC prefill fusion
  measured: 2026-11-04 09:28-10:20 UTC, MI355X TP1 HIP 5/4/0/2/6, A = v2 stack (sglang d8ff624648 = PRs 05, 07,
    08, 11, 13; AITER 285579b62 + PRs 03, 04), B = A + this PR (e65d0985f8)
numerics: Combined residual bit-exact; norm output differs from unfused only by fp32 summation order (1-ulp bf16
  in ~3.8e-6 of elements at hc4 x 2560). GSM8K (real MTP, 1319) 96.65% (stack 96.88%).
env: SGLANG_ENABLE_HC_COMBINE_NORM_FUSION=1 (default on for HIP; set explicitly)
