title: '[Perf] [AMD] QSA: group-strided decode MQA logits launch on ROCm'
status: local
ported_from: aeddbbaf37 (amd-nprotaso/sglang qwen_3_8_improvement, Christian Gilli; launch-setup part only)
description: 'On ROCm the TileLang paged MQA-logits decode kernel (tilelang_qsa_mqa_decode, the #43463 fixed-CTAs-per-row
  grid) scores 4 consecutive index groups per CTA over a grid that spans the page table; CTAs past a row''s context
  exit at once. CUDA keeps the CTAs-per-row levels. One file (qsa/mqa.py), no flag. Needs PR 11 (256 threads, Q
  padded to 16 heads). Only the launch setup of the fork commit is ported (not its -inf fill skip; PR 11 pads Q).'
impact:
  summary: 'agentic C24 leave-one-out: +5.0 P90 (2.5 sd) / +1.2k tput (FULL 84.0 / 122.2k vs 79.0 / 121.0k without
    it); 1.2-1.7x decode MQA logits at 50k-200k context'
  measured: 2026-11-05, MI355X TP1, AgentX agentic C24 3600 s, acceptance 2.32; FULL = 4772396f44 + 06/09/10 + C1
    + this, AITER 285579b62 + 03, 04, 01 (runs/agentic_loo_{L0_full,L0b_full_repeat,LnoD2}_c24, HIP 7/7/0)
  unit: 'wt/d2-bench/bench_decode_mqa.py, 25 shapes (rows 16-192, ctx 20k-200k): logits bit-exact, top-k equal;
    96 rows 87k 113.4 -> 78.3 us, 192 rows 200k 591.5 -> 353.4 us; 16 rows 20k 5.9 -> 8.4 us (only slower shape)'
numerics: Bit-exact (same logits and top-k). GSM8K (real MTP, 1314 scored) 96.80% with 17 and 18-21 (D5 tree).
